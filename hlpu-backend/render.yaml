# Render Blueprint — hLPU Backend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: hlpu-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: hlpu-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false  # Set manually in Render dashboard
      - key: JWT_SECRET
        sync: false  # Set manually in Render dashboard
      - key: FRONTEND_URL
        value: https://hlpu.vercel.app

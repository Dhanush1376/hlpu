<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hLPU</title>
    <link rel="icon" type="image/png" href="../assets/images/hlpu-logo.png">

    <!-- Bootstrap 4.6.2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <!-- Font Awesome 6.5.2 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/core/NavBar.css" />
    <link rel="stylesheet" href="../css/core/Main.css" />
    <link rel="stylesheet" href="./Styles/Container.css" />
    <!-- Mobile Alumni -->
    <link rel="stylesheet" href="../css/mobile-nav.css" />
    <link rel="stylesheet" href="../css/mobile-alumni.css" />
    <link rel="stylesheet" href="../css/mobile-alumni-circle.css" />
    <link rel="stylesheet" href="../css/mobile-fixes.css" />

    <style>
        /* ===== SMART NETWORKING BAR (Phase 5) ===== */
        .smart-bar {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 35px;
            box-shadow: 0 12px 40px -15px rgba(10, 26, 47, 0.1);
        }

        .search-group {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            margin-bottom: 20px;
        }

        .search-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input-wrapper i {
            position: absolute;
            left: 20px;
            color: #94a3b8;
        }

        .search-input-field {
            width: 100%;
            padding: 14px 20px 14px 50px;
            border: 1.5px solid rgba(10, 26, 47, 0.08);
            border-radius: 16px;
            font-size: 0.95rem;
            background: white;
            transition: all 0.3s;
        }

        .search-input-field:focus {
            outline: none;
            border-color: var(--ember);
            box-shadow: 0 0 0 4px rgba(194, 73, 31, 0.06);
        }

        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .filter-select {
            padding: 10px 16px;
            border-radius: 12px;
            border: 1.5px solid rgba(10, 26, 47, 0.05);
            background: white;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--ink);
            cursor: pointer;
            min-width: 140px;
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--ember);
        }

        .btn-premium {
            background: var(--ink);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .btn-premium:hover {
            background: #1a2e4c;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -6px rgba(10, 26, 47, 0.3);
        }

        .online-dot {
            color: var(--online);
            font-size: 8px;
        }

        /* ===== NAV PILLS TABS ===== */
        .nav-pills {
            display: flex;
            overflow-x: auto;
            flex-wrap: nowrap;
            padding-bottom: 5px;
            gap: 15px;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(194, 73, 31, 0.15);
        }

        .nav-pills .nav-link {
            font-size: 0.95rem;
            padding: 12px 28px;
            background: transparent;
            border-radius: 40px;
            color: #5f6b7a !important;
            white-space: nowrap;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            border: 1.5px solid transparent;
        }

        .nav-pills .nav-link.active {
            background: linear-gradient(145deg, var(--ember), var(--gilt));
            color: white !important;
            box-shadow: 0 10px 20px -8px rgba(194, 73, 31, 0.4);
        }

        .nav-pills .nav-link:hover:not(.active) {
            background: rgba(255, 255, 255, 0.8);
            border-color: rgba(194, 73, 31, 0.3);
            color: var(--ember) !important;
        }

        /* ===== CARDS GRID ===== */
        .cards-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            padding: 10px 0;
        }

        @media (min-width: 768px) {
            .cards-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1200px) {
            .cards-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* ===== PROFESSIONAL ALUMNI CARDS (LinkedIn Style) ===== */
        .alumni-card {
            background: white;
            border: 1px solid rgba(10, 26, 47, 0.08);
            border-radius: 20px;
            padding: 0;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        .alumni-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px -15px rgba(10, 26, 47, 0.12);
            border-color: var(--ember);
        }

        .card-cover-minimal {
            height: 60px;
            background: linear-gradient(135deg, rgba(194, 73, 31, 0.05) 0%, rgba(230, 138, 46, 0.05) 100%);
            width: 100%;
        }

        .alumni-card .card-content {
            padding: 24px;
            padding-top: 0;
            margin-top: -30px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .alumni-profile-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 12px;
        }

        .alumni-avatar-wrapper {
            width: 80px;
            height: 80px;
            border-radius: 24px;
            overflow: hidden;
            border: 4px solid white;
            box-shadow: 0 4px 12px rgba(10, 26, 47, 0.1);
            background: white;
        }

        .alumni-avatar-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .stream-badge {
            background: rgba(194, 73, 31, 0.1);
            color: var(--ember);
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .alumni-info h5 {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .verify-icon {
            color: #3b82f6;
            font-size: 0.9rem;
        }

        .alumni-headline {
            font-size: 0.85rem;
            color: #475569;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .metadata-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin-bottom: 16px;
            padding-top: 12px;
            border-top: 1px solid rgba(10, 26, 47, 0.04);
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #64748b;
        }

        .meta-item i {
            color: var(--ember);
            width: 14px;
            text-align: center;
        }

        .availability-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .availability-badge.available {
            background: #ecfdf5;
            color: #059669;
        }

        .availability-badge.busy {
            background: #fef2f2;
            color: #dc2626;
        }

        .premium-action-bar {
            padding: 16px 24px;
            background: rgba(10, 26, 47, 0.02);
            border-top: 1px solid rgba(10, 26, 47, 0.05);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-card-action {
            padding: 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            transition: all 0.2s;
            cursor: pointer;
            border: 1.5px solid transparent;
        }

        .btn-card-primary {
            background: var(--ink);
            color: white;
        }

        .btn-card-primary:hover {
            background: #1a2e4c;
        }

        .btn-card-outline {
            border-color: rgba(10, 26, 47, 0.1);
            color: var(--ink);
            background: white;
        }

        .btn-card-outline:hover {
            border-color: var(--ember);
            color: var(--ember);
        }

        .full-width-action {
            grid-column: span 2;
        }

        .card-header h5 {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--ink);
            margin: 0;
            flex: 1;
        }

        .status-badge {
            font-size: 0.7rem;
            padding: 4px 12px;
            border-radius: 40px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-badge.online {
            background: rgba(39, 174, 96, 0.08);
            color: var(--online);
            border: 1px solid rgba(39, 174, 96, 0.2);
        }

        .status-badge.offline {
            background: rgba(127, 140, 141, 0.08);
            color: var(--offline);
            border: 1px solid rgba(127, 140, 141, 0.2);
        }

        .card-body {
            padding: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-body p {
            font-size: 0.9rem;
            color: #3f4d5e;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-body i {
            color: var(--ember);
            width: 16px;
        }

        /* ===== SKILL TAGS ===== */
        .alumni-skills {
            margin: 16px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .skill-tag {
            background: rgba(194, 73, 31, 0.08);
            color: var(--ember);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid rgba(194, 73, 31, 0.15);
            cursor: pointer;
            transition: var(--transition);
        }

        .skill-tag:hover {
            background: var(--ember);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px -6px rgba(194, 73, 31, 0.3);
        }

        /* ===== BUTTONS ===== */
        .card-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-connect {
            background: transparent;
            color: var(--ink);
            border: 1.5px solid rgba(10, 26, 47, 0.15);
            padding: 10px 18px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-connect:hover {
            background: var(--ink);
            color: white;
            border-color: var(--ink);
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -8px rgba(10, 26, 47, 0.2);
        }

        .btn-connect.connected {
            background: linear-gradient(145deg, var(--success), #27ae60);
            color: white;
            border: none;
        }

        .btn-message {
            background: white;
            color: var(--ink);
            border: 1.5px solid rgba(10, 26, 47, 0.15);
            padding: 10px 18px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-message:hover {
            border-color: var(--gilt);
            color: var(--gilt);
            background: rgba(230, 138, 46, 0.05);
            transform: translateY(-2px);
        }

        /* ===== CIRCLE CARDS (Redesigned) ===== */
        .circle-card {
            background: rgba(194, 73, 31, 0.02);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(194, 73, 31, 0.1);
            border-radius: 24px;
            padding: 30px 24px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
            opacity: 0;
            transform: translateY(20px);
        }

        .circle-card:hover {
            background: white;
            border-color: var(--ember);
            transform: translateY(-8px);
            box-shadow: 0 20px 40px -12px rgba(10, 26, 47, 0.1);
        }

        .circle-card.active {
            opacity: 1;
            transform: translateY(0);
        }

        .circle-card.create-card {
            border: 2px dashed rgba(194, 73, 31, 0.3);
            background: rgba(194, 73, 31, 0.02);
        }

        .circle-card.create-card:hover {
            border-color: var(--ember);
            background: rgba(194, 73, 31, 0.05);
        }

        .circle-icon {
            font-size: 2.8rem;
            color: var(--ember);
            margin-bottom: 16px;
        }

        .circle-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 8px;
        }

        .circle-members {
            font-size: 0.85rem;
            color: #5f6b7a;
            margin-bottom: 20px;
        }

        .circle-stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 15px 0;
            border-top: 1px solid rgba(194, 73, 31, 0.1);
            border-bottom: 1px solid rgba(194, 73, 31, 0.1);
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--ember);
            line-height: 1;
        }

        .stat-label {
            font-size: 0.7rem;
            color: #5f6b7a;
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-join {
            background: transparent;
            color: var(--ember);
            border: 1.5px solid var(--ember);
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-join:hover {
            background: var(--ember);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -8px rgba(194, 73, 31, 0.3);
        }

        .btn-join.joined {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }

        /* ===== MODAL STYLES ===== */
        .modal-content {
            background: rgba(255, 250, 240, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            border: 1px solid rgba(194, 73, 31, 0.15);
            box-shadow: var(--shadow-hover);
        }

        .modal-header {
            border-bottom: 1px solid rgba(194, 73, 31, 0.1);
            padding: 25px 30px;
        }

        .modal-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--ink);
            letter-spacing: -0.01em;
        }

        .modal-title i {
            color: var(--ember);
            margin-right: 12px;
        }

        .modal-body {
            padding: 30px;
        }

        .modal-footer {
            border-top: 1px solid rgba(194, 73, 31, 0.1);
            padding: 20px 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            font-weight: 600;
            color: var(--ink);
            font-size: 0.9rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-label i {
            color: var(--ember);
        }

        .form-control {
            width: 100%;
            padding: 14px 18px;
            border-radius: 18px;
            border: 1.5px solid rgba(10, 26, 47, 0.08);
            background: white;
            font-size: 0.95rem;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--ember);
            box-shadow: 0 0 0 4px rgba(194, 73, 31, 0.08);
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            border: 1px solid rgba(194, 73, 31, 0.08);
        }

        .empty-state i {
            font-size: 4rem;
            color: var(--gilt);
            opacity: 0.5;
            margin-bottom: 20px;
        }

        .empty-state h4 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #5f6b7a;
            margin-bottom: 0;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 992px) {
            .hero {
                padding: 20px;
            }

            .container-glass {
                padding: 30px;
            }

            .hero h1 {
                font-size: 2rem;
            }
        }

        @media (max-width: 768px) {

            #navbar,
            .mesh-bg,
            .hero,
            .footer {
                display: none !important;
            }
        }

        @media (max-width: 576px) {
            .hero h1 {
                font-size: 1.6rem;
            }

            .filter-badges {
                gap: 8px;
            }

            .filter-badge {
                padding: 6px 16px;
                font-size: 0.8rem;
            }
        }

        /* ===== ANIMATIONS ===== */
        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOutRight {
            from {
                transform: translateX(0);
                opacity: 1;
            }

            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }

        .custom-notification {
            position: fixed;
            top: 90px;
            right: 30px;
            z-index: 9999;
            background: var(--ink);
            color: white;
            padding: 16px 24px;
            border-radius: 40px;
            font-weight: 500;
            box-shadow: var(--shadow-hover);
            animation: slideInRight 0.3s ease-out;
            max-width: 350px;
            border-left: 6px solid var(--gilt);
            backdrop-filter: blur(10px);
        }
    </style>
</head>

<body>


    <!-- MOBILE ROOT - Injected High in DOM -->
    <div id="mobile-root"></div>

    <div id="navbar"></div>

    <!-- mesh background -->
    <div class="mesh-bg">
        <div class="mesh mesh-1"></div>
        <div class="mesh mesh-2"></div>
        <div class="mesh mesh-3"></div>
        <div class="mesh mesh-4"></div>
    </div>
    <!-- MAIN CONTENT -->
    <section class="hero">
        <div class="container-glass">
            <!-- PAGE HEADER -->
            <h1>Alumni Circles</h1>
            <p>Connect with fellow alumni, join communities, and expand your professional network</p>
            <hr class="divider">

            <!-- SMART NETWORKING BAR (Phase 5) -->
            <div class="smart-bar">
                <div class="search-group">
                    <div class="search-input-wrapper">
                        <i class="fas fa-search"></i>
                        <input type="text" class="search-input-field" id="smartSearch"
                            placeholder="Search by name, role, company or skills...">
                    </div>
                    <button class="btn-premium" onclick="AlumniCircle.performSmartSearch()">
                        <i class="fas fa-filter"></i> Search
                    </button>
                </div>

                <div class="filter-row">
                    <select class="filter-select" id="streamFilter">
                        <option value="">All Streams</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Mechanical">Mechanical</option>
                        <option value="Management">Management</option>
                        <option value="Design">Design</option>
                    </select>

                    <select class="filter-select" id="mentorFilter">
                        <option value="false">All Alumni</option>
                        <option value="true">Mentors Only</option>
                    </select>

                    <select class="filter-select" id="expFilter">
                        <option value="0">Any Experience</option>
                        <option value="2">2+ Years</option>
                        <option value="5">5+ Years</option>
                        <option value="10">10+ Years</option>
                    </select>

                    <select class="filter-select" id="sortFilter">
                        <option value="recent">Recently Active</option>
                        <option value="experience">Most Experienced</option>
                        <option value="newest">Newly Joined</option>
                    </select>

                    <button class="btn btn-link text-muted p-0 ml-auto" onclick="AlumniCircle.resetFilters()">
                        <i class="fas fa-undo"></i> Reset
                    </button>
                </div>
            </div>

            <!-- TABS -->
            <ul class="nav nav-pills" id="alumniTabs" role="tablist">
                <li class="nav-item">
                    <a class="nav-link active" id="discovery-tab" data-toggle="pill" href="#discovery" role="tab">
                        <i class="fas fa-search"></i> Discovery
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="requests-tab" data-toggle="pill" href="#requests" role="tab">
                        <i class="fas fa-paper-plane"></i> Requests <span class="badge badge-light ml-2 d-none"
                            id="requestCount">0</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="connections-tab" data-toggle="pill" href="#connections" role="tab">
                        <i class="fas fa-link"></i> Connections
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="circles-tab" data-toggle="pill" href="#join-circles" role="tab">
                        <i class="fas fa-users"></i> Join Circles
                    </a>
                </li>
            </ul>

            <!-- TAB CONTENT -->
            <div class="tab-content" id="alumniTabsContent">
                <!-- DISCOVERY TAB -->
                <div class="tab-pane fade show active" id="discovery" role="tabpanel">
                    <div class="cards-grid" id="discoveryGrid">
                        <!-- Loaded via API -->
                        <div class="text-center py-5 w-100 grid-column-all">
                            <i class="fas fa-spinner fa-spin fa-3x text-ember"></i>
                            <p class="mt-3">Finding alumni for you...</p>
                        </div>
                    </div>
                </div>

                <!-- REQUESTS TAB -->
                <div class="tab-pane fade" id="requests" role="tabpanel">
                    <div class="mb-4">
                        <h5 class="text-ink font-weight-bold mb-3">Incoming Requests</h5>
                        <div class="cards-grid" id="incomingRequestsGrid"></div>
                    </div>
                    <hr class="divider opacity-20">
                    <div>
                        <h5 class="text-ink font-weight-bold mb-3">Outgoing Requests</h5>
                        <div class="cards-grid" id="outgoingRequestsGrid"></div>
                    </div>
                </div>

                <!-- CONNECTIONS TAB -->
                <div class="tab-pane fade" id="connections" role="tabpanel">
                    <div class="cards-grid" id="connectionsGrid"></div>
                </div>

                <!-- JOIN CIRCLES TAB (Placeholder for legacy feature) -->
                <div class="tab-pane fade" id="join-circles" role="tabpanel">
                    <div class="cards-grid" id="circlesGrid"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- CREATE CIRCLE MODAL -->
    <div class="modal fade" id="createCircleModal" tabindex="-1" role="dialog">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fas fa-plus-circle"></i> Create New Circle
                    </h5>
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="createCircleForm">
                        <div class="form-group">
                            <label class="form-label">
                                <i class="fas fa-tag"></i> Circle Name
                            </label>
                            <input type="text" class="form-control" placeholder="e.g., Class of 2018, Tech Enthusiasts">
                        </div>
                        <div class="form-group">
                            <label class="form-label">
                                <i class="fas fa-align-left"></i> Description
                            </label>
                            <textarea class="form-control" rows="3" placeholder="What's this circle about?"></textarea>
                        </div>
                        <div class="form-group">
                            <label class="form-label">
                                <i class="fas fa-layer-group"></i> Circle Type
                            </label>
                            <select class="form-control">
                                <option value="">Select type</option>
                                <option>Batch Circle</option>
                                <option>Industry Group</option>
                                <option>Location Based</option>
                                <option>Interest Group</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-outline-heritage" data-dismiss="modal">
                        <i class="fas fa-times"></i> Cancel
                    </button>
                    <button type="button" class="btn-connect" onclick="createCircle()">
                        <i class="fas fa-check"></i> Create Circle
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Socket.io Library -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="../js/core/api.js"></script>

    <script>
        // Use a module-like pattern to avoid global namespace pollution
        const AlumniCircle = {
            state: {
                discovery: [],
                connections: [],
                incoming: [],
                outgoing: [],
                onlineUsers: {},
                currentFilter: 'all',
                searchQuery: '',
                pagination: {
                    page: 1,
                    pages: 1,
                    loading: false
                }
            },

            async init() {
                this.initSocket();
                await this.loadCurrentTab();
                this.setupEventListeners();
                this.startPresencePolling();
            },

            initSocket() {
                const token = localStorage.getItem('token');
                if (!token || typeof io === 'undefined') return;

                // Use the same API_BASE logic as api.js for consistency
                const socketUrl = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || !window.location.hostname)
                    ? API_BASE
                    : window.location.origin;

                this.socket = window.socket || io(socketUrl, { auth: { token } });
                window.socket = this.socket; // Share globally if not already

                this.socket.on('alumni:request:new', (data) => {
                    showNotification(`New connection request from ${data.requester.name}`, 'info');
                    this.fetchRequests();
                    this.updateRequestBadge(1);
                });

                this.socket.on('alumni:request:accepted', (data) => {
                    showNotification(`${data.recipient.name} accepted your connection request!`, 'success');
                    this.refreshAll();
                });

                this.socket.on('alumni:connection:online', ({ userId }) => {
                    this.state.onlineUsers[userId] = true;
                    this.updatePresenceUI(userId, true);
                });

                this.socket.on('alumni:connection:offline', ({ userId }) => {
                    delete this.state.onlineUsers[userId];
                    this.updatePresenceUI(userId, false);
                });

                this.socket.on('alumni:status:list', (list) => {
                    this.state.onlineUsers = list;
                    this.refreshPresenceAll();
                });

                // Request initial status list
                this.socket.emit('alumni:status:ping');
            },

            async loadCurrentTab() {
                const activeTab = $('.nav-pills .nav-link.active').attr('href').substring(1);
                console.log('Loading tab:', activeTab);

                switch (activeTab) {
                    case 'discovery': await this.fetchDiscovery(); break;
                    case 'requests': await this.fetchRequests(); break;
                    case 'connections': await this.fetchConnections(); break;
                    case 'join-circles': await this.fetchCircles(); break; // Added implementation
                }
            },

            async fetchDiscovery(append = false) {
                try {
                    const grid = document.getElementById('discoveryGrid');
                    if (this.state.pagination.loading) return;

                    if (!append) {
                        this.state.pagination.page = 1;
                        grid.innerHTML = `
                            <div class="text-center py-5 w-100 grid-column-all">
                                <i class="fas fa-circle-notch fa-spin fa-3x text-ember"></i>
                                <p class="mt-3 font-weight-bold">Exploring the network...</p>
                            </div>
                        `;
                    } else {
                        const loadBtn = document.getElementById('loadMoreBtn');
                        if (loadBtn) loadBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading...';
                    }

                    this.state.pagination.loading = true;

                    // Phase 5: Build params from smart bar
                    const search = document.getElementById('smartSearch')?.value || '';
                    const stream = document.getElementById('streamFilter')?.value || '';
                    const mentorOnly = document.getElementById('mentorFilter')?.value || 'false';
                    const minExperience = document.getElementById('expFilter')?.value || '0';
                    const sort = document.getElementById('sortFilter')?.value || 'recent';

                    const params = new URLSearchParams({
                        search,
                        stream,
                        mentorOnly,
                        availableOnly: mentorOnly,
                        minExperience,
                        sort,
                        page: this.state.pagination.page,
                        limit: 12
                    });

                    const response = await apiFetch(`/api/alumni/circle?${params.toString()}`);
                    this.state.discovery = append ? [...this.state.discovery, ...response.data] : (response.data || []);
                    this.state.pagination.pages = response.pages || 1;

                    this.renderGrid(grid, this.state.discovery, 'discovery');
                    this.renderPagination(grid);

                    this.state.pagination.loading = false;
                } catch (err) {
                    this.state.pagination.loading = false;
                    this.showError('discoveryGrid', `Sync Error: ${err.message || 'Failed to synchronize with networking engine'}`);
                }
            },

            renderPagination(grid) {
                const existing = document.getElementById('paginationWrapper');
                if (existing) existing.remove();

                if (this.state.pagination.page < this.state.pagination.pages) {
                    const wrapper = document.createElement('div');
                    wrapper.id = 'paginationWrapper';
                    wrapper.className = 'w-100 text-center py-4 grid-column-all';
                    wrapper.innerHTML = `
                        <button class="btn-premium" id="loadMoreBtn" onclick="AlumniCircle.loadMore()">
                            Load More Alumni
                        </button>
                    `;
                    grid.appendChild(wrapper);
                }
            },

            loadMore() {
                this.state.pagination.page++;
                this.fetchDiscovery(true);
            },

            performSmartSearch() {
                this.fetchDiscovery();
            },

            resetFilters() {
                if (document.getElementById('smartSearch')) document.getElementById('smartSearch').value = '';
                if (document.getElementById('streamFilter')) document.getElementById('streamFilter').value = '';
                if (document.getElementById('mentorFilter')) document.getElementById('mentorFilter').value = 'false';
                if (document.getElementById('expFilter')) document.getElementById('expFilter').value = '0';
                if (document.getElementById('sortFilter')) document.getElementById('sortFilter').value = 'recent';
                this.fetchDiscovery();
            },

            async fetchConnections() {
                try {
                    const grid = document.getElementById('connectionsGrid');
                    const results = await apiFetch('/api/alumni/connections');
                    this.state.connections = results || [];
                    this.renderGrid(grid, this.state.connections, 'connection');
                } catch (err) {
                    this.showError('connectionsGrid', 'Failed to load connections');
                }
            },

            async fetchRequests() {
                try {
                    const incoming = await apiFetch('/api/alumni/requests/incoming');
                    const outgoing = await apiFetch('/api/alumni/requests/outgoing');

                    this.state.incoming = incoming || [];
                    this.state.outgoing = outgoing || [];

                    this.renderGrid(document.getElementById('incomingRequestsGrid'), this.state.incoming, 'incoming');
                    this.renderGrid(document.getElementById('outgoingRequestsGrid'), this.state.outgoing, 'outgoing');

                    this.updateRequestBadge(this.state.incoming.length, true);
                } catch (err) {
                    console.error('Failed to load requests:', err);
                }
            },

            async fetchCircles() {
                try {
                    const grid = document.getElementById('circlesGrid');
                    grid.innerHTML = '<div class="text-center py-5 w-100 grid-column-all"><i class="fas fa-spinner fa-spin fa-2x text-ember"></i></div>';

                    const results = await apiFetch('/api/alumni/circles');
                    this.renderGrid(grid, results || [], 'circle_list');
                } catch (err) {
                    this.showError('circlesGrid', 'Failed to synchronize micro-communities');
                }
            },

            renderGrid(container, items, type) {
                if (!container) return;

                if (type === 'circle_list') {
                    const cardsHtml = [
                        this.createCardHtml({}, 'circle_create', 0),
                        ...items.map((item, idx) => this.createCardHtml(item, 'circle', idx + 1))
                    ];
                    container.innerHTML = cardsHtml.join('');
                } else {
                    if (items.length === 0) {
                        container.innerHTML = `
                            <div class="empty-state w-100 grid-column-all">
                                <i class="fas fa-${type === 'incoming' ? 'paper-plane' : 'users'}"></i>
                                <h4>No ${type} found</h4>
                                <p>${this.getEmptyMessage(type)}</p>
                            </div>
                        `;
                        return;
                    }

                    if (type === 'incoming') {
                        container.innerHTML = items.map((item, idx) => {
                            const reqUser = item.requester;
                            return this.createCardHtml({ ...reqUser, _id: item._id, userId: reqUser._id }, 'incoming_raw', idx);
                        }).join('');
                    } else if (type === 'outgoing') {
                        container.innerHTML = items.map((item, idx) => {
                            const recUser = item.recipient;
                            return this.createCardHtml({ ...recUser, _id: item._id, userId: recUser._id }, 'outgoing_raw', idx);
                        }).join('');
                    } else {
                        container.innerHTML = items.map((item, idx) => this.createCardHtml(item, type, idx)).join('');
                    }
                }
                this.animateCards(container);
            },

            createCardHtml(item, type, idx) {
                if (type === 'circle_create') {
                    return `
                        <div class="circle-card create-card slide-in active" onclick="$('#createCircleModal').modal('show')">
                            <div class="circle-icon"><i class="fas fa-plus-circle"></i></div>
                            <h4 class="circle-title">Start a Circle</h4>
                            <p class="circle-members">Create a micro-community</p>
                            <button class="btn-join">Start Group</button>
                        </div>
                    `;
                }

                if (type === 'circle') {
                    return `
                        <div class="circle-card slide-in active">
                            <div class="circle-icon"><i class="fas fa-users-viewfinder"></i></div>
                            <h4 class="circle-title">${item.name}</h4>
                            <p class="circle-members">${item.memberCount || 0} Members established</p>
                            <div class="circle-stats">
                                <div class="stat">
                                    <div class="stat-value">${item.postCount || 0}</div>
                                    <div class="stat-label">Daily Posts</div>
                                </div>
                                <div class="stat">
                                    <div class="stat-value">${item.activeCount || 0}</div>
                                    <div class="stat-label">Online</div>
                                </div>
                            </div>
                            <button class="btn-join ${item.isJoined ? 'joined' : ''}" onclick="AlumniCircle.toggleCircle('${item._id}', this)">
                                <i class="fas fa-${item.isJoined ? 'check' : 'plus'}"></i> 
                                ${item.isJoined ? 'Joined' : 'Join Community'}
                            </button>
                        </div>
                    `;
                }

                const isOnline = this.state.onlineUsers[item._id || item.id] || item.isOnline;
                const name = item.name;
                const headline = item.title ? `${item.title} @ ${item.company || 'Professional'}` : (item.company || 'Corporate Alumnus');
                const id = item._id || item.id;
                const profilePic = item.profilePicture || item.profilePic || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=random`;

                let primaryBtn = '';
                let secondaryBtn = `<div class="btn-card-action btn-card-outline full-width-action" onclick="AlumniCircle.viewProfile('${id}')">View Profile</div>`;

                if (item.connectionStatus === 'accepted' || type === 'connection') {
                    primaryBtn = `<div class="btn-card-action btn-card-primary" onclick="AlumniCircle.message('${id}')"><i class="fas fa-comment"></i> Message</div>`;
                    secondaryBtn = `<div class="btn-card-action btn-card-outline" onclick="AlumniCircle.viewProfile('${id}')">Profile</div>`;
                } else if (item.connectionStatus === 'pending' || type === 'outgoing_raw') {
                    primaryBtn = `<div class="btn-card-action btn-card-outline full-width-action" style="cursor: default; opacity: 0.7;"><i class="fas fa-clock"></i> Pending Approval</div>`;
                } else if (type === 'incoming_raw') {
                    primaryBtn = `<div class="btn-card-action btn-card-primary" onclick="AlumniCircle.respond('${item._id}', 'accepted', this)"><i class="fas fa-check"></i> Accept</div>`;
                    secondaryBtn = `<div class="btn-card-action btn-card-outline" onclick="AlumniCircle.respond('${item._id}', 'rejected', this)">Ignore</div>`;
                } else {
                    primaryBtn = `<div class="btn-card-action btn-card-primary full-width-action" onclick="AlumniCircle.connect('${id}', this)"><i class="fas fa-user-plus"></i> Connect</div>`;
                }

                return `
                    <div class="alumni-card slide-in active" data-user-id="${id}">
                        <div class="card-cover-minimal"></div>
                        <div class="card-content">
                            <div class="alumni-profile-header">
                                <div class="alumni-avatar-wrapper">
                                    <img src="${profilePic}" alt="${name}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=random'">
                                </div>
                                <div class="stream-badge">${item.stream || 'hLPU Alumnus'}</div>
                            </div>
                            
                            <div class="alumni-info">
                                <h5>${name} ${item.verificationStatus === 'approved' ? '<i class="fas fa-check-circle verify-icon" title="Verified Alumni"></i>' : ''}</h5>
                                <div class="alumni-headline">${headline}</div>
                            </div>

                            <div class="metadata-grid">
                                <div class="meta-item">
                                    <i class="fas fa-briefcase"></i> ${item.yearsOfExperience || 0}+ Years Experience
                                </div>
                                <div class="meta-item">
                                    <i class="fas fa-graduation-cap"></i> ${item.graduationYear || 'Class of N/A'}
                                </div>
                                <div class="availability-badge ${item.isMentorAvailable ? 'available' : 'busy'}">
                                    <i class="fas fa-shield-halved"></i> ${item.isMentorAvailable ? 'Mentor Available' : 'Busy'}
                                </div>
                            </div>

                            <div class="alumni-skills">
                                ${(item.skills || []).slice(0, 3).map(s => `<span class="skill-tag">${s}</span>`).join('')}
                            </div>
                            
                            <div class="d-flex flex-wrap gap-2 mt-auto pt-2" style="border-top: 1px dashed rgba(10, 26, 47, 0.05);">
                                ${(item.networkingLabels || []).map(l => `<span style="font-size:0.65rem; color:#64748b; background:#f1f5f9; padding:2px 8px; border-radius:4px;"><i class="fas fa-sparkles mr-1" style="font-size:0.6rem; color:#f59e0b;"></i> ${l}</span>`).join('')}
                            </div>
                        </div>

                        <div class="premium-action-bar">
                            ${primaryBtn}
                            ${secondaryBtn}
                        </div>

                        <div style="position:absolute; top:45px; left:88px; width:14px; height:14px; border-radius:50%; background:${isOnline ? '#10b981' : '#94a3b8'}; border:3px solid white; z-index:10;" id="status-${id}"></div>
                    </div>
                `;
            },

            async connect(alumniId, btn) {
                try {
                    btn.style.pointerEvents = 'none';
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

                    await apiFetch(`/api/alumni/connect/${alumniId}`, { method: 'POST' });

                    btn.innerHTML = '<i class="fas fa-clock"></i> Pending';
                    btn.classList.replace('btn-card-primary', 'btn-card-outline');
                    showNotification('Connection request sent!', 'success');
                } catch (err) {
                    showNotification(err.message, 'error');
                    btn.style.pointerEvents = 'auto';
                    btn.innerHTML = '<i class="fas fa-user-plus"></i> Connect';
                }
            },

            async respond(requestId, action, btn) {
                try {
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                    await apiFetch(`/api/alumni/requests/${requestId}/respond`, {
                        method: 'PATCH',
                        body: JSON.stringify({ action })
                    });

                    showNotification(`Connection ${action}`, 'success');
                    this.fetchRequests();
                    if (action === 'accepted') this.fetchConnections();
                } catch (err) {
                    showNotification(err.message, 'error');
                    btn.innerHTML = action === 'accepted' ? 'Accept' : 'Ignore';
                }
            },

            viewProfile(id) {
                showNotification('Opening professional profile...', 'info');
            },

            message(alumniId) {
                window.location.href = `Messages.html?userId=${alumniId}`;
            },

            async toggleCircle(circleId, btn) {
                try {
                    const isJoined = btn.classList.contains('joined');
                    btn.disabled = true;
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

                    const res = await apiFetch(`/api/alumni/circles/${circleId}/join`, { method: 'POST' });

                    btn.disabled = false;
                    if (res.isJoined) {
                        btn.classList.add('joined');
                        btn.innerHTML = '<i class="fas fa-check"></i> Joined';
                        showNotification('Welcome to the community!', 'success');
                    } else {
                        btn.classList.remove('joined');
                        btn.innerHTML = '<i class="fas fa-plus"></i> Join Community';
                        showNotification('You have left the community', 'info');
                    }

                    // Refresh count if we had one (optional)
                    if (res.memberCount !== undefined) {
                        const card = btn.closest('.circle-card');
                        const countEl = card.querySelector('.circle-members');
                        if (countEl) countEl.textContent = `${res.memberCount} Members established`;
                    }
                } catch (err) {
                    showNotification(err.message, 'error');
                    btn.disabled = false;
                    btn.innerHTML = btn.classList.contains('joined') ? '<i class="fas fa-check"></i> Joined' : '<i class="fas fa-plus"></i> Join Community';
                }
            },

            updatePresenceUI(userId, isOnline) {
                const indicator = document.getElementById(`status-${userId}`);
                if (indicator) {
                    indicator.style.background = isOnline ? '#10b981' : '#94a3b8';
                }
            },

            refreshPresenceAll() {
                Object.keys(this.state.onlineUsers).forEach(uid => {
                    this.updatePresenceUI(uid, true);
                });
            },

            updateRequestBadge(count, absolute = false) {
                const badge = document.getElementById('requestCount');
                if (!badge) return;

                let current = absolute ? count : (parseInt(badge.textContent) + count);
                if (current > 0) {
                    badge.textContent = current;
                    badge.classList.remove('d-none');
                } else {
                    badge.classList.add('d-none');
                }
            },

            getEmptyMessage(type) {
                const msgs = {
                    discovery: "No alumni match your current search/filter. Try adjusting them!",
                    connection: "You haven't established any connections yet. Start professional networking!",
                    incoming: "No incoming connection requests at the moment.",
                    outgoing: "You haven't sent any connection requests recently."
                };
                return msgs[type] || "Nothing to show here.";
            },

            animateCards(container) {
                const cards = container.querySelectorAll('.slide-in');
                cards.forEach((card, i) => {
                    setTimeout(() => card.classList.add('active'), i * 50);
                });
            },

            showError(gridId, msg) {
                const grid = document.getElementById(gridId);
                if (grid) grid.innerHTML = `
                    <div class="empty-state w-100 grid-column-all">
                        <i class="fas fa-exclamation-triangle text-muted opacity-30"></i>
                        <h4>Interface Interrupted</h4>
                        <p>${msg}</p>
                        <button class="btn btn-sm btn-outline-heritage mt-3" onclick="location.reload()">Reload Interface</button>
                    </div>
                `;
            },

            setupEventListeners() {
                const smartSearch = document.getElementById('smartSearch');
                if (smartSearch) {
                    smartSearch.addEventListener('keyup', (e) => {
                        if (e.key === 'Enter') this.performSmartSearch();
                    });
                }

                ['streamFilter', 'mentorFilter', 'expFilter', 'sortFilter'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.onchange = () => this.fetchDiscovery();
                });

                $('a[data-toggle="pill"]').on('shown.bs.tab', (e) => {
                    this.loadCurrentTab();
                });
            },

            startPresencePolling() {
                setInterval(() => {
                    if (this.socket && this.socket.connected) {
                        this.socket.emit('alumni:status:ping');
                    }
                }, 30000);
            },

            refreshAll() {
                this.fetchDiscovery();
                this.fetchConnections();
                this.fetchRequests();
            }
        };

        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof loadComponent === 'function') {
                loadComponent('navbar', 'Navbar-Alumini.html');
            }
            AlumniCircle.init();
        });

        // Helper for notifications (compatible with existing UI)
        function showNotification(message, type = 'info') {
            if (typeof Swal !== 'undefined') {
                Swal.fire({
                    toast: true,
                    position: 'top-end',
                    showConfirmButton: false,
                    timer: 3000,
                    icon: type,
                    title: message
                });
            } else {
                const notification = document.createElement('div');
                notification.className = 'custom-notification';
                notification.style.background = type === 'success' ? '#0F7B3A' : (type === 'error' ? '#B02A37' : '#0A1A2F');
                notification.innerHTML = `
                    <div class="d-flex align-items-center">
                        <i class="fas fa-${type === 'success' ? 'check-circle' : 'info-circle'} mr-3"></i>
                        <span style="font-weight: 500;">${message}</span>
                    </div>
                `;
                document.body.appendChild(notification);
                setTimeout(() => {
                    notification.style.animation = 'slideOutRight 0.3s ease-out';
                    setTimeout(() => notification.remove(), 300);
                }, 3000);
            }
        }
    </script>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hLPU</title>
  <link rel="icon" type="image/png" href="../assets/images/hlpu logo.png">

  <!-- Bootstrap 4.6 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Google Fonts - Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <!-- SweetAlert2 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />
  <link rel="stylesheet" href="../css/core/NavBar.css" />
  <link rel="stylesheet" href="../css/core/Main.css" />
  <link rel="stylesheet" href="../css/mobile-nav.css" />
  <link rel="stylesheet" href="../css/mobile-fixes.css" />
  <style>
    /* ===== HERO SECTION ===== */
    .hero {
      padding: 25px 20px;
      margin-top: 80px;
      min-height: calc(100vh - 100px);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    /* ===== PREMIUM GLASS CONTAINER ===== */
    .container-glass {
      width: 100%;
      max-width: 1200px;
      background: var(--glass);
      backdrop-filter: blur(16px);
      padding: 35px;
      margin: 20px 0;
      border-radius: 32px;
      box-shadow: var(--shadow-elevation);
      border: 1px solid rgba(194, 73, 31, 0.08);
      transition: var(--transition);
      animation: slideUp 0.6s ease forwards;
      position: relative;
      z-index: 2;
    }

    .container-glass:hover {
      background: var(--glass-deep);
      border-color: rgba(230, 138, 46, 0.2);
      box-shadow: var(--shadow-hover);
    }

    @keyframes slideUp {
      from {
        transform: translateY(30px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .hero h1 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 10px;
      text-align: left;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hero h1 i {
      color: var(--ember);
      font-size: 1.8rem;
    }

    .hero p {
      font-size: 1rem;
      color: #52606d;
      text-align: left;
      margin-bottom: 25px;
      font-weight: 400;
    }

    hr {
      border: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--ember), var(--gilt));
      margin: 25px 0;
      opacity: 0.2;
      border-radius: 2px;
    }

    /* ===== PREMIUM SEARCH BAR ===== */
    .search-container {
      position: relative;
      margin-bottom: 30px;
    }

    .search-bar {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(8px);
      border-radius: 60px;
      padding: 6px 6px 6px 20px;
      border: 1.5px solid rgba(10, 26, 47, 0.06);
      transition: var(--transition);
    }

    .search-bar:focus-within {
      border-color: var(--ember);
      background: white;
      box-shadow: 0 0 0 4px rgba(194, 73, 31, 0.08);
    }

    .search-bar i {
      color: var(--ember);
      margin-right: 12px;
      font-size: 1.1rem;
    }

    .search-bar input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: 0.95rem;
      color: var(--ink);
      padding: 12px 0;
      font-family: 'Inter', sans-serif;
    }

    .search-bar input::placeholder {
      color: #8f9aaa;
      font-weight: 400;
    }

    .search-btn {
      background: var(--ink);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: var(--transition);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-btn:hover {
      background: #12243f;
      transform: translateX(3px);
    }

    /* ===== PREMIUM CATEGORY FILTERS ===== */
    .category-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 30px;
      padding-bottom: 10px;
    }

    .category-filter {
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(4px);
      border: 1.5px solid rgba(10, 26, 47, 0.06);
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--ink);
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .category-filter:hover {
      background: white;
      border-color: var(--gilt);
      transform: translateY(-2px);
    }

    .category-filter.active {
      background: var(--ink);
      color: white;
      border-color: var(--ink);
    }

    .category-filter.active i {
      color: white;
    }

    .category-filter i {
      color: var(--ember);
      font-size: 0.9rem;
    }

    /* ===== COURSE CARDS ===== */
    .courses-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 25px;
      margin-top: 10px;
    }

    .course-card {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      padding: 24px;
      box-shadow: var(--shadow-elevation);
      transition: var(--transition);
      border: 1px solid rgba(194, 73, 31, 0.08);
      opacity: 0;
      transform: translateY(20px);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .course-card:hover {
      background: white;
      border-color: var(--gilt);
      transform: translateY(-5px);
      box-shadow: var(--shadow-hover);
    }

    .course-card.slide-in {
      opacity: 1;
      transform: translateY(0);
    }

    .course-header {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 18px;
    }

    .course-icon-container {
      width: 60px;
      height: 60px;
      background: linear-gradient(145deg, rgba(194, 73, 31, 0.08), rgba(230, 138, 46, 0.08));
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .course-icon {
      font-size: 1.8rem;
      color: var(--ember);
    }

    .course-info {
      flex: 1;
    }

    .course-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--ink);
      margin: 0 0 8px 0;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }

    .course-description {
      font-size: 0.9rem;
      color: #5f6b7a;
      margin: 0;
      line-height: 1.5;
    }

    .course-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .course-tag {
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(10, 26, 47, 0.08);
      border-radius: 40px;
      padding: 6px 14px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .course-tag i {
      color: var(--ember);
      font-size: 0.7rem;
    }

    .course-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 18px;
      border-top: 1px solid rgba(10, 26, 47, 0.06);
      margin-top: auto;
    }

    .career-opportunities {
      font-size: 0.85rem;
      color: #5f6b7a;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
    }

    .career-opportunities i {
      color: var(--success-color);
    }

    .btn-heritage {
      background: white;
      color: var(--ink);
      border: 1px solid rgba(10, 26, 47, 0.1);
      padding: 10px 20px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
      text-decoration: none;
      cursor: pointer;
    }

    .btn-heritage:hover {
      background: var(--ink);
      color: white;
      border-color: var(--ink);
      transform: translateY(-3px);
      box-shadow: 0 12px 20px -10px rgba(10, 26, 47, 0.3);
      text-decoration: none;
    }

    .btn-heritage i {
      font-size: 0.8rem;
    }

    /* ===== MODAL STYLES ===== */
    .modal-content {
      background: rgba(255, 250, 240, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      border: 1px solid rgba(194, 73, 31, 0.15);
      box-shadow: var(--shadow-hover);
    }

    .modal-header {
      border-bottom: 1px solid rgba(10, 26, 47, 0.06);
      padding: 28px 32px;
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--ink);
      margin: 0;
      letter-spacing: -0.01em;
    }

    .modal-subtitle {
      font-size: 0.95rem;
      color: var(--ember);
      margin: 8px 0 0 0;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 500;
    }

    .modal-subtitle i {
      color: var(--ember);
    }

    .modal-body {
      padding: 32px;
      max-height: 70vh;
      overflow-y: auto;
    }

    .modal-footer {
      border-top: 1px solid rgba(10, 26, 47, 0.06);
      padding: 24px 32px;
    }

    .close {
      font-size: 1.5rem;
      color: var(--ink);
      opacity: 0.6;
      transition: var(--transition);
    }

    .close:hover {
      opacity: 1;
      color: var(--ember);
    }

    /* ===== INFO GRID ===== */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .info-item {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(10, 26, 47, 0.06);
      border-radius: 20px;
      padding: 18px;
    }

    .info-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #5f6b7a;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .info-value {
      font-size: 1rem;
      font-weight: 700;
      color: var(--ink);
    }

    .stars {
      display: flex;
      gap: 4px;
      margin-top: 4px;
    }

    .stars i {
      color: var(--gilt);
      font-size: 0.9rem;
    }

    /* ===== SECTION TITLES ===== */
    .modal-section {
      margin-bottom: 28px;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--ink);
      margin: 0 0 16px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 2px solid rgba(194, 73, 31, 0.1);
      padding-bottom: 12px;
    }

    .section-title i {
      color: var(--ember);
    }

    /* ===== TECH TAGS ===== */
    .tech-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tech-tag {
      background: rgba(194, 73, 31, 0.06);
      border: 1px solid rgba(194, 73, 31, 0.15);
      color: var(--ink);
      padding: 8px 18px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
    }

    .tech-tag:hover {
      background: var(--ember);
      color: white;
      border-color: var(--ember);
    }

    .tech-tag i {
      font-size: 0.8rem;
    }

    /* ===== LIST CONTENT ===== */
    .list-content {
      padding-left: 20px;
      margin-bottom: 0;
    }

    .list-content li {
      font-size: 0.9rem;
      color: #3f4d5e;
      margin-bottom: 10px;
      line-height: 1.5;
      position: relative;
      padding-left: 8px;
    }

    .list-content li::marker {
      color: var(--ember);
      font-weight: 600;
    }

    /* ===== ROADMAP TIMELINE ===== */
    .roadmap-timeline {
      position: relative;
      padding-left: 30px;
    }

    .roadmap-timeline::before {
      content: '';
      position: absolute;
      left: 8px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(to bottom, var(--ember), var(--gilt));
      opacity: 0.3;
    }

    .timeline-item {
      position: relative;
      margin-bottom: 25px;
      padding-bottom: 25px;
      border-bottom: 1px solid rgba(10, 26, 47, 0.06);
    }

    .timeline-item:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: -30px;
      top: 5px;
      width: 16px;
      height: 16px;
      background: var(--ember);
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 0 2px rgba(194, 73, 31, 0.2);
    }

    .timeline-year {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--ember);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .timeline-content {
      font-size: 0.9rem;
      color: #3f4d5e;
      line-height: 1.6;
    }

    /* ===== NO COURSES MESSAGE ===== */
    .no-courses-message {
      text-align: center;
      padding: 60px 20px;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(8px);
      border-radius: 32px;
      border: 2px dashed rgba(194, 73, 31, 0.2);
      margin: 30px 0;
    }

    .no-courses-message i {
      font-size: 3rem;
      color: var(--gilt);
      opacity: 0.4;
      margin-bottom: 20px;
    }

    .no-courses-message h3 {
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 10px;
    }

    .no-courses-message p {
      font-size: 0.95rem;
      color: #5f6b7a;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .container-glass {
        padding: 25px 20px;
        border-radius: 24px;
      }

      .hero h1 {
        font-size: 1.6rem;
      }

      .courses-grid {
        grid-template-columns: 1fr;
      }

      .search-bar {
        flex-direction: column;
        background: transparent;
        padding: 0;
      }

      .search-bar input {
        width: 100%;
        background: rgba(255, 255, 255, 0.7);
        border-radius: 60px;
        padding: 14px 20px;
        margin-bottom: 10px;
      }

      .search-btn {
        width: 100%;
        justify-content: center;
      }

      .category-filters {
        gap: 8px;
      }

      .category-filter {
        padding: 10px 18px;
        font-size: 0.85rem;
      }

      .course-header {
        flex-direction: column;
        gap: 12px;
      }

      .course-icon-container {
        align-self: flex-start;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 576px) {
      .hero h1 {
        font-size: 1.4rem;
      }

      .category-filters {
        flex-direction: column;
      }

      .category-filter {
        width: 100%;
        justify-content: center;
      }

      .modal-header {
        padding: 20px;
      }

      .modal-body {
        padding: 20px;
      }

      .modal-title {
        font-size: 1.2rem;
      }
    }
  </style>

</head>

  <div id="navbar"></div>

        <button class="category-filter" data-category="science">

  </section>

  <!-- COURSE DETAILS MODAL -->
  <div class="modal fade" id="courseModal" tabindex="-1" aria-labelledby="courseModalLabel" aria-hidden="true">

      <div class="modal-content">
        <div class="modal-header">
          <div>
            <h5 class="modal-title" id="courseModalLabel">Course Details</h5>
            <div class="modal-subtitle" id="modalSubtitle"></div>
          </div>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body" id="modalBody">
          <!-- Content dynamically inserted -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-heritage" data-dismiss="modal">
            <i class="fas fa-times"></i> Close
          </button>
          <button type="button" class="btn-heritage" id="connectMentorBtn"
            style="background: var(--ember); color: white; border-color: var(--ember);">
            <i class="fas fa-handshake"></i> Connect with Mentor
          </button>
        </div>
      </div>
    </div>
  </div>

    // DOM Elements
    const coursesContainer = document.querySelector('#coursesContainer .courses-grid');
    const categoryFilters = document.querySelectorAll('.category-filter');
    const courseSearch = document.getElementById('courseSearch');
    const searchBtn = document.getElementById('searchBtn');

    // ===== INITIALIZATION =====
    function initCourses() {
      displayCourses(coursesData);
      animateCards();
    }

    // ===== DISPLAY COURSES =====
    function displayCourses(courses) {
      coursesContainer.innerHTML = '';

      if (courses.length === 0) {
        coursesContainer.innerHTML = `
          <div class="no-courses-message">
            <i class="fas fa-map-signs"></i>
            <h3>No courses found</h3>
            <p>Try adjusting your search or filter criteria</p>
          </div>
        `;
        return;
      }

      courses.forEach(course => {
        const courseCard = document.createElement('div');
        courseCard.className = 'course-card';
        courseCard.dataset.id = course.id;
        courseCard.dataset.category = course.category;

        courseCard.innerHTML = `
          <div class="course-header">
            <div class="course-icon-container">
              <i class="${course.icon} course-icon"></i>
            </div>
            <div class="course-info">
              <h3 class="course-title">${course.title}</h3>
              <p class="course-description">${course.description}</p>
            </div>
          </div>
          <div class="course-tags">
            ${course.keywords.map(keyword => `
              <span class="course-tag">
                <i class="fas fa-tag"></i> ${keyword}
              </span>
            `).join('')}
          </div>
          <div class="course-footer">
            <div class="career-opportunities">
              <i class="fas fa-briefcase"></i>
              <span>${course.careerCount}</span>
            </div>
            <button class="btn-heritage explore-course" data-id="${course.id}">
              Explore Careers
              <i class="fas fa-arrow-right"></i>
            </button>
          </div>
        `;

        coursesContainer.appendChild(courseCard);
      });

      // Add event listeners to explore buttons
      document.querySelectorAll('.explore-course').forEach(btn => {
        btn.addEventListener('click', function (e) {
          e.preventDefault();
          const courseId = this.dataset.id;
          const course = coursesData.find(c => c.id === courseId);
          if (course && course.roles && course.roles.length > 0) {
            showCourseModal(course, course.roles[0]);
          }
        });
      });

      animateCards();
    }

    // ===== ANIMATE CARDS =====
    function animateCards() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry, index) => {
          if (entry.isIntersecting) {
            setTimeout(() => {
              entry.target.classList.add('slide-in');
            }, index * 100);
          }
        });
      }, { threshold: 0.1 });

      document.querySelectorAll('.course-card').forEach(card => observer.observe(card));
    }

    // ===== SHOW COURSE MODAL =====
    function showCourseModal(course, role) {
      document.getElementById('courseModalLabel').textContent = role.title;
      document.getElementById('modalSubtitle').innerHTML = `
        <i class="fas fa-graduation-cap"></i>
        ${course.title} · ${course.category.charAt(0).toUpperCase() + course.category.slice(1)}
      `;

      const modalBody = document.getElementById('modalBody');
      modalBody.innerHTML = `
        <div class="info-grid">
          <div class="info-item">
            <div class="info-label">Expected Salary</div>
            <div class="info-value">${role.salary}</div>
          </div>
          <div class="info-item">
            <div class="info-label">Difficulty Level</div>
            <div class="stars">
              ${Array.from({ length: 5 }, (_, i) =>
        i < role.difficulty ?
          '<i class="fas fa-star"></i>' :
          '<i class="far fa-star"></i>'
      ).join('')}
            </div>
          </div>
          <div class="info-item">
            <div class="info-label">Career Growth</div>
            <div class="info-value">High Potential</div>
          </div>
          <div class="info-item">
            <div class="info-label">Market Demand</div>
            <div class="info-value">🔥 Growing</div>
          </div>
        </div>

        <div class="modal-section">
          <h3 class="section-title">
            <i class="fas fa-bullseye"></i> Role Overview
          </h3>
          <p style="color: var(--text-medium); line-height: 1.7; margin-bottom: 0;">${role.description}</p>
        </div>

        <div class="modal-section">
          <h3 class="section-title">
            <i class="fas fa-code"></i> Core Technologies
          </h3>
          <div class="tech-tags">
            ${role.technologies.map(tech => `
              <span class="tech-tag">
                <i class="fas fa-cube"></i> ${tech}
              </span>
            `).join('')}
          </div>
        </div>

        <div class="modal-section">
          <h3 class="section-title">
            <i class="fas fa-tasks"></i> Key Responsibilities
          </h3>
          <ul class="list-content">
            ${role.responsibilities.map(resp => `<li>${resp}</li>`).join('')}
          </ul>
        </div>

        <div class="modal-section">
          <h3 class="section-title">
            <i class="fas fa-rocket"></i> Portfolio Projects
          </h3>
          <ul class="list-content">
            ${role.projects.map(project => `<li>${project}</li>`).join('')}
          </ul>
        </div>

        <div class="modal-section">
          <h3 class="section-title">
            <i class="fas fa-book-open"></i> Learning Resources
          </h3>
          <ul class="list-content">
            ${role.resources.map(resource => `<li>${resource}</li>`).join('')}
          </ul>
        </div>

        <div class="modal-section">
          <h3 class="section-title">
            <i class="fas fa-road"></i> 4-Year Academic Roadmap
          </h3>
          <div class="roadmap-timeline">
            ${role.roadmap.map(item => `
              <div class="timeline-item">
                <div class="timeline-year">${item.year}</div>
                <div class="timeline-content">${item.content}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;

      $('#courseModal').modal('show');
    }

    // ===== FILTER COURSES =====
    function filterCourses(category) {
      if (category === 'all') {
        displayCourses(coursesData);
      } else {
        const filteredCourses = coursesData.filter(course => course.category === category);
        displayCourses(filteredCourses);
      }
    }

    // ===== SEARCH COURSES =====
    function searchCourses(query) {
      const filteredCourses = coursesData.filter(course =>
        course.title.toLowerCase().includes(query.toLowerCase()) ||
        course.description.toLowerCase().includes(query.toLowerCase()) ||
        course.keywords.some(keyword => keyword.toLowerCase().includes(query.toLowerCase())) ||
        course.roles.some(role =>
          role.title.toLowerCase().includes(query.toLowerCase()) ||
          role.technologies.some(tech => tech.toLowerCase().includes(query.toLowerCase()))
        )
      );
      displayCourses(filteredCourses);
    }

    // ===== EVENT LISTENERS =====
    categoryFilters.forEach(btn => {
      btn.addEventListener('click', function () {
        categoryFilters.forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        filterCourses(this.dataset.category);
      });
    });

    courseSearch.addEventListener('input', function () {
      searchCourses(this.value);
    });

    searchBtn.addEventListener('click', function () {
      searchCourses(courseSearch.value);
    });

    // ===== CONNECT WITH MENTOR BUTTON =====
    document.getElementById('connectMentorBtn').addEventListener('click', function () {
      Swal.fire({
        icon: 'success',
        title: 'Mentor Request Sent!',
        text: 'An alumni mentor will reach out to you within 48 hours.',
        confirmButtonColor: '#C2491F',
        background: '#FFF8F0',
        timer: 2500,
        showConfirmButton: true,
        confirmButtonText: 'Great!'
      });
    });

    // ===== INITIALIZE ON PAGE LOAD =====
    document.addEventListener('DOMContentLoaded', initCourses);
  </script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>hLPU</title>
    <link rel="icon" type="image/png" href="assets/images/hlpu logo.png">
    
    <!-- Google Fonts - Inter (matching main theme) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ===== HLPU PREMIUM THEME — SPLASH HERITAGE ===== */
        :root {
            --ink: #0A1A2F;
            --ember: #C2491F;
            --gilt: #E68A2E;
            --soft-cream: #FFF8F0;
            --glass: rgba(255, 250, 240, 0.85);
            --shadow-elevation: 0 20px 35px -10px rgba(10, 26, 47, 0.15);
            --transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--ink); /* Fallback */
            color: var(--ink);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* ===== PREMIUM MESH BACKGROUND ===== */
        .mesh-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            pointer-events: none;
        }

        .mesh {
            position: absolute;
            width: 100%;
            height: 100%;
            background-blend-mode: overlay;
            opacity: 0.4;
            animation: breathe 8s infinite alternate ease-in-out;
        }

        .mesh-1 { 
            background: radial-gradient(circle at 20% 30%, #FCE7C8, #E5D9F2 40%, transparent 70%);
        }
        .mesh-2 { 
            background: radial-gradient(circle at 90% 70%, #D6E6F5, #FFD9B0 30%, transparent 70%);
            animation-delay: -1s;
        }
        .mesh-3 { 
            background: radial-gradient(circle at 30% 80%, #FADADD, #FDCFB0 40%, transparent 70%);
            animation-delay: -2s;
        }
        .mesh-4 { 
            background: radial-gradient(circle at 70% 20%, #DFE7FF, #F9E6CF 35%, transparent 70%);
            animation-delay: -4s;
        }

        @keyframes breathe {
            0% { opacity: 0.3; }
            100% { opacity: 0.5; }
        }

        /* ===== MAIN CONTAINER ===== */
        .splash-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            z-index: 10;
        }

        /* ===== GLASS CARD ===== */
        .splash-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(194, 73, 31, 0.15);
            border-radius: 48px;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-elevation);
            animation: cardAppear 1s ease-out;
            width: 100%;
            max-width: 440px;
        }

        @keyframes cardAppear {
            0% { 
                opacity: 0;
                transform: scale(0.95) translateY(20px);
                backdrop-filter: blur(0px);
            }
            100% { 
                opacity: 1;
                transform: scale(1) translateY(0);
                backdrop-filter: blur(20px);
            }
        }

        /* ===== LOGO CONTAINER ===== */
        .logo-wrapper {
            position: relative;
            margin-bottom: 40px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo {
            width: 85%;
            max-width: 260px;
            height: auto;
            opacity: 0;
            transform: scale(0.9);
            transition: var(--transition);
            filter: drop-shadow(0 10px 20px rgba(194, 73, 31, 0.2));
            animation: logoFloat 4s infinite alternate ease-in-out;
        }

        .show-logo {
            opacity: 1;
            transform: scale(1);
        }

        @keyframes logoFloat {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-5px) scale(1.02); }
        }

        /* ===== LOGO SHIMMER EFFECT ===== */
        .logo-shimmer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.2) 50%,
                transparent 100%
            );
            opacity: 0;
            animation: shimmer 3s infinite;
            pointer-events: none;
            border-radius: 20px;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); opacity: 0; }
            20% { transform: translateX(100%); opacity: 0.4; }
            100% { transform: translateX(100%); opacity: 0; }
        }

        /* ===== TAGLINE ===== */
        .tagline {
            color: var(--ink);
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 30px;
            opacity: 0;
            transform: translateY(10px);
            transition: var(--transition);
            transition-delay: 0.3s;
            text-align: center;
        }

        .show-tagline {
            opacity: 0.8;
            transform: translateY(0);
        }

        /* ===== PREMIUM LOADER ===== */
        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            opacity: 0;
            transition: var(--transition);
            transition-delay: 0.2s;
        }

        .show-loader {
            opacity: 1;
        }

        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            width: 100%;
        }

        .loader-dot {
            width: 14px;
            height: 14px;
            background: linear-gradient(145deg, var(--ember), var(--gilt));
            border-radius: 50%;
            animation: premiumLoader 1.4s infinite ease-in-out both;
            box-shadow: 0 0 15px rgba(194, 73, 31, 0.3);
        }

        .loader-dot:nth-child(1) {
            animation-delay: -0.32s;
            width: 16px;
            height: 16px;
        }
        .loader-dot:nth-child(2) {
            animation-delay: -0.16s;
            width: 18px;
            height: 18px;
        }
        .loader-dot:nth-child(3) {
            animation-delay: 0;
            width: 20px;
            height: 20px;
        }

        @keyframes premiumLoader {
            0%, 80%, 100% { 
                transform: scale(0.6);
                opacity: 0.5;
                box-shadow: 0 0 10px rgba(194, 73, 31, 0.2);
            }
            40% { 
                transform: scale(1);
                opacity: 1;
                box-shadow: 0 0 25px rgba(230, 138, 46, 0.5);
            }
        }

        /* ===== PROGRESS BAR ===== */
        .progress-container {
            width: 70%;
            margin-top: 15px;
            opacity: 0.8;
        }

        .progress-bar-bg {
            width: 100%;
            height: 4px;
            background: rgba(10, 26, 47, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--ember), var(--gilt));
            border-radius: 10px;
            animation: progressFill 5s ease-out forwards;
            box-shadow: 0 0 10px rgba(194, 73, 31, 0.5);
        }

        @keyframes progressFill {
            0% { width: 0%; }
            20% { width: 30%; }
            50% { width: 60%; }
            80% { width: 85%; }
            100% { width: 100%; }
        }

        /* ===== HERITAGE QUOTE ===== */
        .heritage-quote {
            margin-top: 40px;
            color: var(--ink);
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            opacity: 0;
            transform: translateY(10px);
            transition: var(--transition);
            transition-delay: 0.8s;
            text-align: center;
            border-top: 1px solid rgba(194, 73, 31, 0.2);
            padding-top: 25px;
            width: 80%;
        }

        .show-quote {
            opacity: 0.7;
            transform: translateY(0);
        }

        .heritage-quote i {
            color: var(--ember);
            margin: 0 5px;
        }

        /* ===== DECORATIVE ELEMENTS ===== */
        .decor-circle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(194,73,31,0.1) 0%, transparent 70%);
            z-index: -1;
        }

        .circle-1 {
            width: 300px;
            height: 300px;
            top: -100px;
            left: -100px;
            animation: rotateSlow 20s infinite linear;
        }

        .circle-2 {
            width: 400px;
            height: 400px;
            bottom: -150px;
            right: -150px;
            background: radial-gradient(circle, rgba(230,138,46,0.08) 0%, transparent 70%);
            animation: rotateSlow 25s infinite linear reverse;
        }

        @keyframes rotateSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .splash-card {
                padding: 50px 30px;
                border-radius: 36px;
            }
            
            .logo {
                max-width: 200px;
            }
            
            .loader-dot {
                width: 12px;
                height: 12px;
            }
            
            .loader-dot:nth-child(1) { width: 14px; height: 14px; }
            .loader-dot:nth-child(2) { width: 16px; height: 16px; }
            .loader-dot:nth-child(3) { width: 18px; height: 18px; }
            
            .tagline {
                font-size: 0.8rem;
                letter-spacing: 2px;
            }
        }

        @media (max-width: 380px) {
            .splash-card {
                padding: 40px 20px;
            }
            
            .logo {
                max-width: 160px;
            }
            
            .heritage-quote {
                font-size: 0.75rem;
                padding-top: 20px;
            }
        }

        /* ===== FADE OUT ANIMATION ===== */
        .fade-out {
            animation: fadeOut 0.8s ease-in-out forwards;
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* ===== SAFE AREA FOR NOTCHES ===== */
        @supports (padding: max(0px)) {
            .splash-container {
                padding-left: max(20px, env(safe-area-inset-left));
                padding-right: max(20px, env(safe-area-inset-right));
                padding-top: max(20px, env(safe-area-inset-top));
                padding-bottom: max(20px, env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <!-- PREMIUM MESH BACKGROUND -->
    <div class="mesh-bg">
        <div class="mesh mesh-1"></div>
        <div class="mesh mesh-2"></div>
        <div class="mesh mesh-3"></div>
        <div class="mesh mesh-4"></div>
    </div>

    <!-- DECORATIVE CIRCLES -->
    <div class="decor-circle circle-1"></div>
    <div class="decor-circle circle-2"></div>

    <!-- MAIN SPLASH CONTAINER -->
    <div class="splash-container">
        <div class="splash-card">
            <!-- LOGO WRAPPER WITH SHIMMER -->
            <div class="logo-wrapper">
                <img class="logo" src="assets/images/hlpu logo.png" alt="hLPU - Heritage Network">
                <div class="logo-shimmer"></div>
            </div>

            <!-- TAGLINE -->
            <div class="tagline" id="tagline">
                BRIDGING GENERATIONS
            </div>

            <!-- LOADER SECTION -->
            <div class="loader-container" id="loaderContainer">
                <div class="loader">
                    <div class="loader-dot"></div>
                    <div class="loader-dot"></div>
                    <div class="loader-dot"></div>
                </div>
                
                <!-- PROGRESS BAR -->
                <div class="progress-container">
                    <div class="progress-bar-bg">
                        <div class="progress-fill"></div>
                    </div>
                </div>
            </div>

            <!-- HERITAGE QUOTE -->
            <div class="heritage-quote" id="heritageQuote">
                <i class="fas fa-quote-left" style="font-size: 0.7rem;"></i> 
                Heritage meets horizon 
                <i class="fas fa-quote-right" style="font-size: 0.7rem;"></i>
            </div>
        </div>
    </div>

    <!-- FONT AWESOME FOR ICONS (lightweight, only what we need) -->
    <script src="https://kit.fontawesome.com/8c5d7f8d5b.js" crossorigin="anonymous"></script>

    <script>
        // ===== HLPU PREMIUM SPLASH SCREEN =====
        // Heritage theme · Smooth transitions · Premium feel
        
        document.addEventListener("DOMContentLoaded", function() {
            const logo = document.querySelector('.logo');
            const tagline = document.getElementById('tagline');
            const loaderContainer = document.getElementById('loaderContainer');
            const heritageQuote = document.getElementById('heritageQuote');
            const splashCard = document.querySelector('.splash-card');
            
            // ===== SEQUENCE ANIMATION =====
            
            // 1. Show logo with fade in (0s - 1s)
            setTimeout(function() {
                logo.classList.add('show-logo');
            }, 100); // Quick appear
            
            // 2. Show tagline (0.8s)
            setTimeout(function() {
                tagline.classList.add('show-tagline');
            }, 800);
            
            // 3. Show loader & progress bar (2s)
            setTimeout(function() {
                loaderContainer.classList.add('show-loader');
            }, 2000);
            
            // 4. Show heritage quote (2.5s)
            setTimeout(function() {
                heritageQuote.classList.add('show-quote');
            }, 2500);
            
            // 5. Prepare for transition - fade out card (4.5s)
            setTimeout(function() {
                splashCard.style.transition = 'opacity 0.6s ease, backdrop-filter 0.6s ease';
                splashCard.style.opacity = '0.9';
            }, 4500);
            
            // 6. Fade out completely (5.2s)
            setTimeout(function() {
                splashCard.style.opacity = '0';
                splashCard.style.backdropFilter = 'blur(0px)';
            }, 5200);
            
            // 7. Redirect to landing page (5.8s)
            setTimeout(function() {
                window.location.href = 'Landing-Page.html';
            }, 5800);
            
            // ===== FALLBACK FOR SLOW NETWORKS =====
            // Ensure redirect even if something goes wrong
            setTimeout(function() {
                window.location.href = 'Landing-Page.html';
            }, 8000);
            
            // ===== PRELOAD LANDING PAGE (improves perceived performance) =====
            setTimeout(function() {
                const preloadLink = document.createElement('link');
                preloadLink.rel = 'preload';
                preloadLink.href = 'Landing-Page.html';
                preloadLink.as = 'document';
                document.head.appendChild(preloadLink);
            }, 3000);
            
            // ===== INTERACTIVE HINT (optional subtle effect) =====
            // Add gentle pulse to logo during loading
            setInterval(function() {
                if (loaderContainer.classList.contains('show-loader')) {
                    logo.style.filter = 'drop-shadow(0 10px 25px rgba(194, 73, 31, 0.3))';
                    setTimeout(() => {
                        logo.style.filter = 'drop-shadow(0 10px 20px rgba(194, 73, 31, 0.2))';
                    }, 500);
                }
            }, 2000);
        });
        
        // ===== PREVENT ANY INTERACTION DURING SPLASH =====
        document.body.addEventListener('touchstart', (e) => {
            e.preventDefault();
        }, { passive: false });
        
        document.body.addEventListener('click', (e) => {
            e.preventDefault();
        }, { passive: false });
        
        // Allow redirect to happen naturally
    </script>
</body>
</html>
